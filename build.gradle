
plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/phaze.accesswidener")
}

configurations {
    libImpl
    modImpl
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Opt-in isolated compatibility smoke runs; never bundle or install these jars.
    if (project.hasProperty('portCompatMods')) {
        modRuntimeOnly fileTree(dir: project.property('portCompatMods'), include: ['*.jar'])
    }

    // Compile-only: optional renderer integration. Nothing from Sodium is
    // bundled into Phaze; PhazeMixinPlugin loads these mixins only when the
    // user's instance already has Sodium installed.
    // Use the same Sodium binary as the local 1.21.11 integration target.
    // It remains compile-only and is never packed into PhazeClient.jar.
    compileOnly fileTree("${System.getenv('APPDATA')}/PrismLauncher/instances/1.21.11/minecraft/mods") {
        include 'sodium-fabric-0.8.14*+mc1.21.11*.jar'
        include 'sodium-fabric-0.8.14*+mc1.21.11*.jar.disabled'
    }

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    libImpl fileTree(dir: 'libs', include: ['*.jar'])

    configurations.libImpl.dependencies.each {
        implementation(it)
    }

    configurations.modImpl.dependencies.each {
        modImplementation(it)
        include(it)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.register('verifySignedModuleManifest', Exec) {
    group = 'verification'
    description = 'Checks the signed module catalog against the registered modules'
    inputs.file('src/main/resources/phaze/module-manifest.json')
    inputs.file('src/main/resources/phaze/module-manifest.sig')
    inputs.file('security/manifest-ed25519-public.pem')
    inputs.file('src/main/java/vorga/phazeclient/core/Main.java')
    inputs.dir('src/main/java/vorga/phazeclient/implement/features/modules')
    commandLine 'node', 'scripts/module-manifest.mjs', 'verify'
}
tasks.named('processResources') { dependsOn 'verifySignedModuleManifest' }

tasks.register('verifyPortAssets', Exec) {
    group = 'verification'
    description = 'Validates packaged JSON, sound files and UI-only texture filtering'
    commandLine 'node', 'scripts/verify-port-assets.mjs'
}
tasks.named('check') { dependsOn 'verifyPortAssets' }

sourceSets.test.java.srcDir('scripts')

// Dedicated GL runs select their fixtures without changing the normal client suite.
// The filtered file is a test resource only; the production jar uses src/main/resources.
tasks.named('processTestResources') {
    def blurOnly = project.hasProperty('hudBlurOnly')
    def textureFilterOnly = project.hasProperty('textureFilterOnly')
    def hudEditorOnly = project.hasProperty('hudEditorOnly')
    def bossBarOnly = project.hasProperty('bossBarOnly')
    def guiBenchOnly = project.hasProperty('guiBenchOnly')
    def guiBenchWorld = project.hasProperty('guiBenchWorld')
    def paperDollOnly = project.hasProperty('paperDollOnly')
    inputs.property 'guiBenchWorld', guiBenchWorld
    inputs.property 'paperDollOnly', paperDollOnly
    inputs.property 'hudBlurOnly', blurOnly
    inputs.property 'textureFilterOnly', textureFilterOnly
    inputs.property 'hudEditorOnly', hudEditorOnly
    inputs.property 'bossBarOnly', bossBarOnly
    inputs.property 'guiBenchOnly', guiBenchOnly
    if (blurOnly || textureFilterOnly || hudEditorOnly || bossBarOnly || guiBenchOnly || paperDollOnly) {
        def selected = guiBenchOnly ? [guiBenchWorld ? 'GuiWorldBenchmarkClientTest' : 'GuiRenderBenchmarkClientTest']
                : paperDollOnly ? ['PaperDollClientTest']
                : hudEditorOnly
                ? ['HudEditorClientTest', 'HudCachedReplayClientTest', 'RenderSafetyClientTest']
                : bossBarOnly ? ['BossBarClientTest']
                : textureFilterOnly ? ['TextureFilteringClientTest', 'LoadingOverlayClientTest', 'RenderSafetyClientTest']
                : ['HudCachedReplayClientTest', 'RenderSafetyClientTest', 'HudBlurClientTest']
        filesMatching('fabric.mod.json') {
            filter { String line ->
                if (line.contains('"vorga.')) {
                    if (!selected.any { line.contains(it) }) return null
                    if (line.contains(selected.last())) return line.replaceFirst(/,\s*$/, '')
                }
                return line
            }
        }
    } else {
        filesMatching('fabric.mod.json') {
            filter { String line -> line.contains('BenchmarkClientTest') ? null : line }
        }
    }
}

tasks.register('verifyPackPreviewAssetLogic', JavaExec) {
    group = 'verification'
    description = 'Checks deterministic preview selection and straight-alpha composition without a game'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.implement.features.modules.other.PackPreviewAssetLogicTest'
    args file('src/main/java/vorga/phazeclient/implement/features/modules/other/PackPreviewAssets.java').absolutePath
}
tasks.named('check') { dependsOn 'verifyPackPreviewAssetLogic' }

sourceSets {
    portVerification {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    portSmoke {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('verifyMixinTargets', JavaExec) {
    group = 'verification'
    description = 'Checks registered mixin members and injection selectors against 1.21.11 bytecode'
    dependsOn 'portVerificationClasses', 'classes'
    classpath = sourceSets.portVerification.runtimeClasspath
    if (project.hasProperty('portOptionalClasspath')) {
        classpath += fileTree(dir: project.property('portOptionalClasspath'), include: ['*.jar'])
    }
    mainClass = 'vorga.phazeclient.test.MixinTargetChecks'
    def mappingsFile = new File(gradle.gradleUserHomeDir,
            "caches/fabric-loom/${project.minecraft_version}/net.fabricmc.yarn.${project.minecraft_version.replace('.', '_')}.${project.yarn_mappings}-v2/mappings.tiny")
    systemProperty 'phaze.port.mappings', mappingsFile.absolutePath
}
tasks.named('check') { dependsOn 'verifyMixinTargets' }

// src/test is the verify* JavaExec suite, not JUnit. Gradle 9 fails `test` when it
// discovers none; those JavaExec tasks are already required by `check`.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

// Keep standalone checks isolated from the player's config, identity and cache.
fileTree('src/test/java').matching { include '**/*Checks.java'; exclude '**/HeadlessMinecraftChecks.java' }.each { checkFile ->
    def relative = file('src/test/java').toPath().relativize(checkFile.toPath()).toString()
    def mainName = relative.replace(File.separator, '.').replaceAll(/\.java$/, '')
    def taskName = 'verify' + checkFile.name.replaceFirst(/Checks\.java$/, '')
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn 'testClasses'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'vorga.phazeclient.test.HeadlessMinecraftChecks'
        args mainName
        def sandbox = layout.buildDirectory.dir("regression/${taskName}").get().asFile
        // Source/asset checks deliberately inspect repository-relative paths.
        environment 'APPDATA', sandbox.absolutePath
        systemProperty 'user.home', sandbox.absolutePath
        doFirst { sandbox.mkdirs() }
    }
    tasks.named('check') { dependsOn taskName }
}

tasks.register('benchmarkPredictionCpu', JavaExec) {
    group = 'verification'
    description = 'Optional CPU-only prediction comparison; not an in-game FPS/GPU benchmark'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.test.HeadlessMinecraftChecks'
    args 'vorga.phazeclient.implement.features.modules.other.PredictionPerformanceBench'
    if (project.hasProperty('predictionBaseline')) {
        systemProperty 'phaze.prediction.baseline', project.property('predictionBaseline')
    }
    def sandbox = layout.buildDirectory.dir('regression/benchmarkPredictionCpu').get().asFile
    environment 'APPDATA', sandbox.absolutePath
    systemProperty 'user.home', sandbox.absolutePath
    doFirst { sandbox.mkdirs() }
}

tasks.register('benchmarkHitRangeCpu', JavaExec) {
    group = 'verification'
    description = 'Optional CPU-only Hit Range geometry comparison; no in-game FPS/GPU claim'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.implement.hitrange.HitRangePerformanceBench'
    def sandbox = layout.buildDirectory.dir('regression/benchmarkHitRangeCpu').get().asFile
    environment 'APPDATA', sandbox.absolutePath
    systemProperty 'user.home', sandbox.absolutePath
    doFirst { sandbox.mkdirs() }
}

loom {
    mods {
        phazePortSmoke { sourceSet sourceSets.portSmoke }
        phazePreviewTests { sourceSet sourceSets.test }
    }
    runs {
        portSmoke {
            client()
            source sourceSets.portSmoke
            runDir 'build/port-smoke-client'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_port_smoke'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
        }
        packPreviewSmoke {
            client()
            source sourceSets.test
            runDir 'build/pack-preview-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
        }
        hudBlurSmoke {
            client()
            source sourceSets.test
            runDir 'build/hud-blur-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
            if (project.hasProperty('hudBlurBenchmark')) vmArg '-Dphaze.hudBlur.benchmark=true'
        }
        textureFilterSmoke {
            client()
            source sourceSets.test
            runDir 'build/texture-filter-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
        }
        hudEditorSmoke {
            client()
            source sourceSets.test
            runDir 'build/hud-editor-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
        }
        bossBarSmoke {
            client()
            source sourceSets.test
            runDir 'build/boss-bar-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
        }
        guiBench {
            client()
            source sourceSets.test
            runDir 'build/gui-bench-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            vmArg '-Dphaze.rules.api=http://127.0.0.1:1'
            if (project.hasProperty('guiBenchProfile')) {
                vmArg '-Dphaze.guiBench.profile=true'
                if (project.hasProperty('guiBenchCosmetics')) vmArg '-Dphaze.guiBench.cosmetics=true'
                vmArg "-XX:StartFlightRecording=filename=gui-bench.jfr,settings=${project.findProperty('guiBenchJfc') ?: 'profile'}"
            }
        }
    }
}
[
        runPortSmoke: 'port-smoke-client',
        runPackPreviewSmoke: 'pack-preview-client-test',
        runHudBlurSmoke: 'hud-blur-client-test',
        runTextureFilterSmoke: 'texture-filter-client-test',
        runHudEditorSmoke: 'hud-editor-client-test',
        runBossBarSmoke: 'boss-bar-client-test',
        runGuiBench: 'gui-bench-client-test'
].each { runName, dirName ->
    tasks.matching { it.name == runName }.configureEach {
        def sandbox = layout.buildDirectory.dir(dirName).get().asFile
        environment 'APPDATA', sandbox.absolutePath
        systemProperty 'user.home', sandbox.absolutePath
        doFirst { sandbox.mkdirs() }
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // Port aid: javac stops listing after 100 errors by default, which
    // hides the real size of the remaining work. Lift the caps while the
    // 1.21.11 port is in progress.
    it.options.compilerArgs += ['-Xmaxerrs', '20000', '-Xmaxwarns', '20000']
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    from {
        configurations.libImpl.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

// Features are ported as source against 1.21.11. Never overlay compiled
// mixin classes from a different Minecraft version into the output jar.

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {}
}
